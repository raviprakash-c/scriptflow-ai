[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptflow-ai"
version = "0.2.0"
description = "Script and voiceover to B-roll video engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.8,<3.0", "python-multipart>=0.0.9", "httpx>=0.27", "edge-tts>=6.1"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
audio = ["faster-whisper>=1.0", "edge-tts>=6.1"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "scripts*", "outputs*"]
